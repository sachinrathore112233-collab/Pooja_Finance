const ip={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',users:'M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0 M5 21v-2a7 7 0 0 1 14 0v2 M18 4a3 3 0 0 1 0 6 M20 14a5 5 0 0 1 2 4',plans:'M6 3h12v18H6z M9 7h6 M9 11h6 M9 15h4',wallet:'M3 6h17v14H3z M3 6V3h14v3 M16 11h5v5h-5z',device:'M7 2h10v20H7z M11 18h2',credit:'M3 17a9 9 0 1 1 18 0 M12 12l4-4 M6 21h12',up:'M4 17 10 11l4 4 6-10 M15 5h5v5',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 7v5l3 2',check:'m5 12 4 4L19 6',alert:'M12 3 2 21h20z M12 9v5 M12 17h.01'};function ico(n){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ip[n]||ip.plans}"/></svg>`}
let page='Overview',customerMode=false,filter='',paid=false;const customers=[['Rahul Sharma','RS','Samsung Galaxy A55','VF-2026-001','₹2,499','24 Oct 2026','Due today'],['Priya Verma','PV','LG Double Door Refrigerator','VF-2026-002','₹3,250','22 Oct 2026','Overdue'],['Amit Patel','AP','iPhone 15 · 128 GB','VF-2026-003','₹4,999','24 Oct 2026','Due today'],['Neha Jain','NJ','Samsung 43” Smart TV','VF-2026-004','₹2,100','25 Oct 2026','Upcoming'],['Vikram Singh','VS','Poojaas 1.5 Ton AC','VF-2026-005','₹3,800','20 Oct 2026','Overdue']];

function nav(p){page=p;filter='';customerMode=false;render()}function stats(){return `<div class="stats">${[['up','Total financed','₹12,84,500','↑ 12.8%','vs last month'],['clock','Outstanding balance','₹8,42,650','86 active plans','across customers'],['check','Collected this month',paid?'₹1,89,949':'₹1,87,450','↑ 8.2%','vs last month'],['alert','Overdue amount','₹24,850','7 customers','need follow-up']].map((s,i)=>`<div class="stat"><span class="icon">${ico(s[0])}</span><p>${s[1]}</p><div class="value">${s[2]}</div><div class="trend" style="${i===3?'color:#bf8650':''}">${s[3]} <span class="muted">${s[4]}</span></div></div>`).join('')}</div>`}
function rows(all=false){return `<div class="scroll"><table><thead><tr><th>CUSTOMER</th><th>PRODUCT / LOAN</th><th>EMI AMOUNT</th><th>DUE DATE</th><th>STATUS</th><th></th></tr></thead><tbody>${customers.filter(c=>c.join(' ').toLowerCase().includes(filter.toLowerCase())).map((c,i)=>`<tr><td><div class="person"><span class="initial">${c[1]}</span><b>${c[0]}</b></div></td><td>${c[2]}<small>${c[3]}</small></td><td><b>${c[4]}</b></td><td>${c[5]}</td><td>${badge(i===0&&paid?'Paid':c[6])}</td><td>${btn('View →',`detail('${c[0]}')`,'link')}</td></tr>`).join('')}</tbody></table></div>`}
function overview(){return `${stats()}<div class="overviewhero"><span class="small-icon">${ico('clock')}</span><div><b>A clear plan for today.</b><p>5 payments to review · Keep collections moving.</p></div>${btn('Open collections ↗',"nav('Collections')",'link')}</div><div class="grid"><section class="panel"><div class="ph"><div><h2>Collection performance</h2><div class="sub">Cash flow across your installment portfolio</div></div><div class="mini-tabs"><button onclick="toast('Illustrative six-month view')">6M</button><button class="on" onclick="toast('Showing illustrative monthly collections')">Monthly</button></div></div><div class="chart-number"><strong>${paid?'₹1,89,949':'₹1,87,450'}</strong><span>↗ 8.2% <span class="muted">vs last month</span></span></div><div class="linechart"><svg viewBox="0 0 600 150" preserveAspectRatio="none" role="img" aria-label="Illustrative collection trend from May to October"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9047" stop-opacity=".19"/><stop offset="1" stop-color="#ff9047" stop-opacity="0"/></linearGradient></defs><path d="M0 30H600 M0 75H600 M0 120H600" stroke="#353237" stroke-width=".8" stroke-dasharray="3 6"/><path d="M0 126C40 126 55 87 95 96S150 115 195 77 250 89 295 63 350 87 397 44 450 63 495 37 555 45 600 12V150H0Z" fill="url(#fill)"/><path d="M0 126C40 126 55 87 95 96S150 115 195 77 250 89 295 63 350 87 397 44 450 63 495 37 555 45 600 12" fill="none" stroke="#ff9857" stroke-width="2.5" vector-effect="non-scaling-stroke"/><circle cx="600" cy="12" r="4" fill="#ffd0a7"/></svg></div><div class="chartmonths"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span></div><div class="chartkey">● COLLECTIONS &nbsp; / &nbsp; ILLUSTRATIVE TREND · DEMO DATA</div></section><section class="panel"><div class="ph"><div><h2>Portfolio health</h2><div class="sub">A little insight. Better decisions.</div></div><span class="muted">↗</span></div><div class="ringwrap"><div class="ring"><div><strong>86</strong><small>Active plans</small></div></div><div class="legend"><div><i class="dot"></i>On track <b>65</b></div><div><i class="dot" style="background:#b89571"></i>Due soon <b>14</b></div><div><i class="dot" style="background:#343438"></i>Overdue <b>7</b></div></div></div><div class="quick-label">EVERY PAYMENT. A STEP FORWARD.</div><div class="actions">${btn('Explore customer plans ↗',"nav('Installment plans')",'link')}</div></section></div><section class="panel"><div class="ph"><div><h2>Payment watchlist <span class="badge warn">5 ACCOUNTS</span></h2><div class="sub">Upcoming installments and accounts that need attention</div></div>${btn('View all collections ↗',"nav('Collections')",'link')}</div>${rows()}</section>`}
let selected='Rahul Sharma';function detail(n){selected=n;page='Customer details';render()}
function details(){return `<div class="detailgrid"><div><section class="panel"><div class="profile"><span class="initial big">${selected.split(' ').map(s=>s[0]).join('')}</span><div><h2>${selected}</h2><div class="sub">Customer ID · CUS-001 &nbsp; ${badge('Verified')}</div></div></div><div class="kv"><div><small>Mobile number</small><b>+91 98••• ••421</b></div><div><small>Location</small><b>Indore, Madhya Pradesh</b></div><div><small>Finance source</small><b>Shop installment · Own funds</b></div><div><small>Agreement</small><b>Accepted · 24 Jun 2026</b></div></div><div class="device"><div class="phoneicon"></div><div><h2>Samsung Galaxy A55</h2><div class="sub">Awesome Navy · 128 GB</div><div class="sub">Serial / IMEI · ••••••••••2841</div></div></div><div class="kv"><div><small>Product price</small><b>₹29,990</b></div><div><small>Down payment</small><b>₹4,990</b></div><div><small>Financed amount</small><b>₹25,000</b></div><div><small>Plan</small><b>10 installments · 0% interest</b></div></div></section><section class="panel" style="margin-top:22px"><div class="ph"><h2>Repayment schedule</h2>${btn('Download statement',"statement()",'link')}</div><div class="scroll"><table><thead><tr><th>INSTALLMENT</th><th>DUE DATE</th><th>AMOUNT</th><th>STATUS</th></tr></thead><tbody>${Array.from({length:7},(_,i)=>`<tr><td>EMI ${i+1} of 10</td><td>24 ${['Jul','Aug','Sep','Oct','Nov','Dec','Jan'][i]} ${i===6?'2027':'2026'}</td><td>₹${i===6?'2,506':'2,499'}</td><td>${badge(i<3||i===3&&paid?'Paid':i===3?'Due today':'Upcoming')}</td></tr>`).join('')}</tbody></table></div></section></div><div><section class="panel"><div class="ph"><h2>Next payment</h2>${badge(paid?'Paid':'Due today')}</div><div style="padding:0 22px"><div class="value">${paid?'₹0':'₹2,499'}</div><p style="margin-top:8px">24 October 2026</p></div><div class="actions">${btn('＋ Record payment',"payment()")}${btn('Send reminder',"reminder()",'secondary')}</div></section><section class="panel" style="margin-top:22px"><div class="ph"><h2>Device protection</h2>${badge('Demo')}</div><div style="padding:0 22px 20px"><p>Device active · unrestricted</p><div class="sub">OEM enrollment is not connected.</div></div><div class="actions">${btn('View device flow →',"nav('Device protection')",'link')}</div></section><section class="panel" style="margin-top:22px"><div class="ph"><h2>Credit bureau</h2></div><div style="padding:0 22px 22px">${badge('Not reported')}<p style="margin-top:12px;font-size:12px">Shop-funded plan. No bureau reporting connection is active.</p></div></section><section class="panel" style="margin-top:22px"><div class="ph"><h2>Recent activity</h2></div><div class="timeline"><div class="event">✓ September EMI received<small>24 Sep · UPI · ₹2,499</small></div><div class="event">↗ Payment reminder delivered<small>22 Oct · Demo notification</small></div></div></section></div></div>`}
function devicePage(){return `<div class="notice">Interactive explanation only · No phone is enrolled, restricted or remotely controlled.</div><div class="grid"><section class="panel"><div class="ph"><h2>Device financing lifecycle</h2>${badge('Simulation')}</div><div class="timeline">${[['01','Sale & consent','Customer receives the financed phone and clear agreement terms.'],['02','Supported device enrollment','Approved OEM/provider links the device to the finance plan.'],['03','Payment monitoring','Verified repayments update the installment account.'],['04','Notice & policy review','An overdue account is reviewed under applicable rules and agreement.'],['05','Restriction / restoration','Authorized provider handles supported restrictions and verified-payment restoration.']].map(s=>`<div class="event"><span class="badge">${s[0]}</span> <b>${s[1]}</b><small>${s[2]}</small></div>`).join('')}</div></section><section class="panel"><div class="ph"><h2>Example device</h2>${badge('Active')}</div><div class="device"><div class="phoneicon"></div><div><b>Samsung Galaxy A55</b><div class="sub">Rahul Sharma · VF-2026-001</div></div></div><div style="padding:0 22px 22px"><p>Provider: Not connected</p><p>Enrollment: Demo only</p><p>Current restrictions: None</p></div><div class="actions">${btn('Preview reminder screen',"modal('Payment reminder preview',`<div class='balance'><p>Pooja Electronics</p><h2>Your installment is due</h2><strong>₹2,499</strong><p>Please pay your installment or contact the shop for support.</p></div><p>Preview only. This does not lock a device.</p>`)",'secondary')}</div></section></div>`}
function bureau(){return `<div class="notice">Credit bureau reporting is separate from device protection. This prototype does not access or submit credit data.</div><div class="grid"><section class="panel"><div class="ph"><h2>Reporting connection</h2>${badge('Not connected')}</div><div class="timeline"><div class="event"><b>Finance source</b><small>Own-shop installment plan</small></div><div class="event"><b>Reporting institution</b><small>No eligible lender connected</small></div><div class="event"><b>Last bureau submission</b><small>None · Demo workspace</small></div></div><div class="actions">${btn('Understand partner flow',"toast('Eligible lender → validated repayment data → credit bureau update')",'secondary')}</div></section><section class="panel"><div class="ph"><h2>How it works</h2></div><div class="timeline"><div class="event">1. Eligible lender originates the loan.</div><div class="event">2. Payments and days past due are recorded.</div><div class="event">3. Lender validates and submits bureau data.</div><div class="event">4. Bureau updates the customer credit report.</div></div></section></div>`}
function customer(){return `<div class="heading"><div><h1>The customer experience</h1><p>A simple companion for every installment.</p></div>${btn('Back to shop workspace',"customerMode=false;page='Overview';render()",'secondary')}</div><div class="mobile"><div class="mobileheader"><div style="display:flex;justify-content:space-between"><b>ϟ Pooja</b><span>☷</span></div><p style="margin-top:25px">Good morning, Rahul</p><h2 style="margin-top:5px">Your plans, made simple.</h2></div><div class="mobilebody"><div class="balance"><p>Next installment</p><strong>${paid?'₹0':'₹2,499'}</strong><p>${paid?'Payment received. Thank you!':'Due on 24 October 2026'}</p><button onclick="payment()">${paid?'View payment receipt':'Pay installment →'}</button></div><h2>My purchase</h2><div class="device" style="margin:15px 0;padding:18px"><div class="phoneicon" style="height:68px;width:38px"></div><div><b>Samsung Galaxy A55</b><div class="sub">VF-2026-001</div></div></div><div class="minirow"><span>Installments paid</span><b>${paid?'4':'3'} / 10</b></div><div class="minirow"><span>Outstanding balance</span><b>${paid?'₹15,004':'₹17,503'}</b></div><div class="minirow"><span>Device status</span>${badge('Active')}</div><div class="actions" style="padding:20px 0">${btn('My statement',"statement()",'secondary')}${btn('Get support',"toast('Demo support: Visit Pooja Electronics, Indore')",'secondary')}</div><p style="font-size:10px;text-align:center">Demo customer view · No real payments</p></div></div>`}
function labelTables(){document.querySelectorAll('table').forEach(t=>{let hs=[...t.querySelectorAll('th')].map(h=>h.textContent);t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>c.dataset.label=hs[i]||''))})}function render(){let title=page==='Overview'?'Your shop. In perspective.':page;document.getElementById('root').innerHTML=`<div class="app"><aside><div class="brand"><span class="mark">ϟ</span><div>Pooja<span style="color:#ff9857">finance</span><small>RETAIL FINANCE WORKSPACE</small></div></div><div class="shop"><b>▣ &nbsp; Pooja Electronics</b><span class="muted">Indore · Main store &nbsp; ⌄</span></div><div class="label">WORKSPACE</div><div class="navs">${[['Overview','grid'],['Customers','users'],['Installment plans','plans'],['Collections','wallet'],['Device protection','device'],['Credit bureau','credit']].map(([p,i])=>`<button class="nav ${page===p?'active':''}" onclick="nav('${p}')"><span>${ico(i)}</span>${p}</button>`).join('')}</div><div class="bottom"><div class="demo"><b>✧ Interactive UI demo</b><br>Sample customers. Simulated payments and device statuses.</div></div></aside><main><header class="top"><span class="crumb">Workspace &nbsp; / &nbsp; <b>${customerMode?'Customer app':page}</b></span><div class="topright"><button class="switch" onclick="location.href='./customer.html'">${customerMode?'▣ Shop workspace':'▯ Customer app'} ↗</button><span class="avatar">VE</span></div></header><div class="content">${customerMode?customer():`<div class="heading"><div><div class="sub" style="margin-bottom:9px;color:#26836c">Pooja ELECTRONICS &nbsp; / &nbsp; SATURDAY, 24 OCTOBER</div><h1>${title}</h1><p>${page==='Overview'?'A clear view of your customers, collections and growth.':page==='Customer details'?'Everything about this customer, in one place.':'Manage your shop’s installment finance with confidence.'}</p></div>${page==='Overview'||page==='Customers'||page==='Installment plans'?btn('＋ New finance plan',"newplan()"):page==='Customer details'?btn('← All customers',"nav('Customers')",'secondary'):''}</div>${page==='Overview'?overview():page==='Customer details'?details():page==='Device protection'?devicePage():page==='Credit bureau'?bureau():`<section class="panel"><div class="ph"><div><h2>${page==='Collections'?'Payment collection queue':page==='Customers'?'Customer directory':'All installment plans'}</h2><div class="sub">${customers.length} sample accounts · Own-shop finance</div></div><input class="search" placeholder="Search name or product…" oninput="filter=this.value;document.getElementById('results').innerHTML=rows();labelTables()"></div><div id="results">${rows()}</div></section>`}`}<div class="footer"><span>© 2026 Pooja Finance · Electronics shop prototype</span><span>Demo data only &nbsp; • &nbsp; All amounts in INR</span></div></div></main></div>`;labelTables()}
function modal(title,body,action=''){document.getElementById('overlay').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><div style="margin-top:18px">${body}</div><footer>${btn('Close',"closeModal()",'secondary')}${action}</footer></div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),4000)}
function payment(){if(paid){modal('Payment receipt',`<p>Receipt VF-RCT-004<br>Customer: Rahul Sharma<br>Amount: ₹2,499<br>Status: Demo payment recorded<br>Date: 24 October 2026</p>`);return}modal('Record installment payment',`<p>Rahul Sharma · Samsung Galaxy A55</p><label>Amount received (₹)</label><input id="amount" type="number" value="2499" min="1"><label>Payment method</label><select><option>UPI — simulated</option><option>Cash — simulated</option><option>Bank transfer — simulated</option></select><div class="sub">Demo only. No money will move.</div>`,btn('Record demo payment',"if(Number(document.getElementById('amount').value)!==2499){toast('For this demo, enter the scheduled amount ₹2,499');return}paid=true;closeModal();render();toast('Demo payment recorded · Receipt VF-RCT-004')"))}
function reminder(){modal('Preview payment reminder',`<p>Hello Rahul, your installment of ₹2,499 for Samsung Galaxy A55 is due on 24 October 2026. Please contact Pooja Electronics for payment or support.</p><div class="sub">Preview only. No SMS or WhatsApp message is sent.</div>`)}
function newplan(){modal('Create a finance plan',`<label>Customer name</label><input id="newname" placeholder="Enter customer’s full name"><label>Product</label><input id="product" placeholder="e.g. Samsung Galaxy A55"><label>Product price (₹)</label><input id="price" type="number" placeholder="30000"><label>Down payment (₹)</label><input id="down" type="number" placeholder="6000"><label>Tenure</label><select id="tenure"><option value="6">6 months</option><option value="8">8 months</option><option value="10">10 months</option><option value="12">12 months</option></select><div class="sub">Illustrative 0% interest plan · Final installment adjusts rounding.</div>`,btn('Preview plan →',"previewPlan()"))}
function previewPlan(){let name=document.getElementById('newname').value.trim(),prod=document.getElementById('product').value.trim(),price=Number(document.getElementById('price').value),down=Number(document.getElementById('down').value),n=Number(document.getElementById('tenure').value);if(!name||!prod||price<=0||down<0||down>=price){toast('Enter customer, product and valid price/down payment');return}let emi=Math.floor((price-down)/n);modal('Your plan preview',`<div class="kv" style="padding:0"><div><small>Customer</small><b>${escapeHTML(name)}</b></div><div><small>Product</small><b>${escapeHTML(prod)}</b></div><div><small>Financed balance</small><b>₹${(price-down).toLocaleString('en-IN')}</b></div><div><small>Monthly installment</small><b>₹${emi.toLocaleString('en-IN')} × ${n} months*</b></div></div><p style="font-size:12px;margin-top:20px">*Last installment ₹${price-down-emi*(n-1)}. No interest or fees in this illustration. This preview is not saved as a real loan.</p>`,btn('Done',"closeModal();toast('Finance plan preview completed')"))}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function statement(){let blob=new Blob(['DEMO STATEMENT — Pooja ELECTRONICS\nCustomer: Rahul Sharma\nProduct: Samsung Galaxy A55\nFinanced: INR 25000\nInstallments paid: '+(paid?4:3)+' of 10\nIllustrative data only'],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Pooja_Demo_Statement.txt';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
