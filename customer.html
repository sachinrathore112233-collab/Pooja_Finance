let view='Home',paid=false,method='UPI',autopay=false;const rs=n=>'₹'+n.toLocaleString('en-IN');const icons=['home','plans','credit','account'];function go(s){view=s;render();window.scrollTo(0,0)}function header(){return `<header><div class="logo">Pooja<span>.</span><span style="font-size:10px;letter-spacing:1.4px;color:#9b8f86;margin-left:9px;font-weight:400">FINANCE</span></div><button class="round" onclick="notifications()" aria-label="Notifications">${ic('bell')}</button></header>`}function head(t){return `<div class="pagehead"><button class="back" onclick="go('Home')" aria-label="Back">‹</button><h1>${t}</h1></div>`}function product(){return `<div class="product"><div class="phone"></div><div><div class="prodname">Samsung Galaxy A55</div><p>Awesome Navy · 128 GB</p><span class="badge">Active plan</span></div></div>`}function home(){return `<div class="intro"><div class="small">MADE FOR YOUR EVERYDAY</div><h1>Hello, Rahul.</h1><p>Your next step. All taken care of.</p></div><div class="pad"><div class="hero"><div class="hrow"><span class="small">${paid?'NEXT INSTALLMENT':'YOUR INSTALLMENT'}</span><span class="pill">${paid?'On track':'Due today'}</span></div><div class="money">₹2,499<span style="font-size:23px;letter-spacing:-1px;color:#a29891">.00</span></div><p>${paid?'Next payment · 24 November 2026':'Due on 24 October 2026'}</p><div class="herobottom"><span>Samsung Galaxy A55</span><b>PLAN •• 001</b></div></div><div class="paytray"><button onclick="${paid?'receipt()':'pay()'}"><span>${paid?'View your receipt':'Make a payment'}</span><span class="arrow">↗</span></button></div><div class="secure">${paid?'✓ October installment received · Demo':'Protected payment preview · No real charges'}</div><div class="quick">${[['pay','Pay EMI','pay()'],['plans','My plans',"go('My EMI')"],['docs','Documents','docs()'],['help','Support',"go('Support')"]].map(x=>`<button onclick="${x[2]}"><i>${ic(x[0])}</i>${x[1]}</button>`).join('')}</div><div class="card autopayrow" role="button" tabindex="0" onclick="autoPay()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();autoPay()}"><span class="state"></span><div><b>${autopay?'AutoPay enabled · Demo':'Set up EMI AutoPay'}</b><div class="small">${autopay?'₹2,499 · Monthly on the 24th':'One setup. Your monthly EMI, simplified.'}</div></div><span>↗</span></div><div class="sectiontitle"><h2>A little closer to yours.</h2><button class="link" onclick="go('My EMI')">View plan ↗</button></div><div class="card homeplan" onclick="go('My EMI')" style="cursor:pointer">${product()}<div class="monthstrip">${Array.from({length:10},(_,i)=>`<span class="${i<(paid?4:3)?'done':i===(paid?4:3)?'current':''}"></span>`).join('')}</div><div class="numbers" style="margin-top:10px"><span>${paid?4:3} of 10 installments complete</span><b>${paid?'40':'30'}%</b></div><div class="divider"></div><div class="hrow"><span class="small">Left to pay</span><b>${rs(paid?15004:17503)}</b></div></div><div class="sectiontitle"><h2>Recent activity</h2><button class="link" onclick="history()">See all ↗</button></div><div class="card" style="padding-top:5px;padding-bottom:5px"><div class="row"><span class="tick">${ic('tick')}</span><div style="flex:1"><div class="title">Installment received</div><div class="small">${paid?'24 October':'24 September'} · UPI payment</div></div><div style="text-align:right"><b>₹2,499</b><div class="small" style="color:#b0c29e;margin-top:6px">Completed</div></div></div></div><div class="growth"><span class="em">${ic('shield')}</span><div><h3>Your purchase. Your peace of mind.</h3><p>Receipts, schedules and support.<br>Always right here when you need them.</p></div></div>${demotext()}</div>`}function demotext(){return `<div class="demo">Pooja ELECTRONICS · INDORE<br>Interactive UI demo · No real payment or device control</div><a class='demo-switch' href='./index.html'>View shop dashboard ↗</a>`}function emi(){return `${head('My installment plan')}<div class="pad"><div class="card">${product()}<div class="divider"></div><div class="small">PLAN ID · VF-2026-001</div><div class="progress"><div style="width:${paid?40:30}%"></div></div><div class="numbers"><span>${paid?4:3} installments paid</span><span>10 total</span></div><div class="divider"></div><div class="amounts"><div><small>Product price</small><b>₹29,990</b></div><div><small>Down payment</small><b>₹4,990</b></div><div><small>Financed amount</small><b>₹25,000</b></div><div><small>Outstanding</small><b>${rs(paid?15004:17503)}</b></div><div><small>Interest / fees</small><b>0% / ₹0</b></div><div><small>Finance provider</small><b>Pooja Electronics</b></div></div></div><div class="sectiontitle"><h2>Repayment schedule</h2><button class="link" onclick="docs()">Statement ↓</button></div><div class="card schedule">${Array.from({length:10},(_,i)=>{let ok=i<(paid?4:3),due=i==3&&!paid;return `<div class="row"><div><div class="title">Installment ${String(i+1).padStart(2,'0')}</div><div class="small">24 ${['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr'][i]} ${i<6?'2026':'2027'}</div></div><div style="text-align:right"><b>${i===9?'₹2,509':'₹2,499'}</b><div style="margin-top:7px"><span class="badge ${due?'due':''}">${ok?'Paid':due?'Due today':'Upcoming'}</span></div></div></div>`}).join('')}</div><div class="card"><div class="hrow"><b style="font-size:12px">Device status</b><span class="badge">Active · Unrestricted</span></div><p class="small">Device protection is not connected in this demo.</p></div>${demotext()}</div>`}function credit(){return `${head('Credit health')}<div class="pad"><div class="card credit"><div class="circle">—</div><h2 style="font-size:20px">Your credit story</h2><p class="small">No verified CIBIL score is connected.<br>We’ll never show an invented credit score.</p><button class="outline" onclick="sheet('Credit score connection', '<p>This screen will show a verified score only after an authorized bureau integration and your required consent. No credit enquiry is made in this demo.</p>')">About credit score access →</button></div><div class="card"><b>About your shop installment</b><p class="small">This sample plan is financed by Pooja Electronics. No eligible reporting lender is connected, so this plan is not submitted to CIBIL by this app.</p><span class="badge due">Bureau reporting · Not connected</span></div><div class="sectiontitle"><h2>Build better payment habits</h2></div>${[['01','Pay on time','Check your due dates and keep payment receipts.'],['02','Review your credit report','Use an authorized service and raise errors with the lender or bureau.'],['03','Borrow thoughtfully','Keep installments within your monthly budget.']].map(x=>`<div class="card"><div class="small">${x[0]}</div><b>${x[1]}</b><p class="small">${x[2]}</p></div>`).join('')}${demotext()}</div>`}function profile(){return `${head('My account')}<div class="pad"><div class="card" style="text-align:center"><div class="profilepic">RS</div><h2 style="font-size:19px;margin:0 0 6px">Rahul Sharma</h2><div class="small">+91 98••• ••421 · CUS-001</div><div style="margin-top:12px"><span class="badge">Sample customer profile</span></div></div><div class="card">${[['▤','My documents','docs()'],['↙','Payment history','history()'],['◷','Notifications','notifications()'],['♧','Help & support',"go('Support')"],['◎','Language',"sheet('Choose your language',`<button class='method selected' onclick='toast(\"English selected\");closeSheet()'>English ✓</button><button class='method' onclick='toast(\"Hindi translation planned for the production app\")'>हिंदी · Preview coming soon</button>`)"]].map(x=>`<button class="row accountrow" style="border:0;border-bottom:1px solid;background:none;width:100%;text-align:left" onclick="${x[2]}"><span style="font-size:20px;width:30px">${x[0]}</span><b style="flex:1;font-size:12px">${x[1]}</b><span>›</span></button>`).join('')}</div><button class="outline" onclick="sheet('Privacy & consent','<p>Your documents, account details and permissions should be visible and manageable in the production app. This demo stores no KYC or payment credentials.</p>')">Privacy & consent</button>${demotext()}</div>`}function support(){return `${head('Here to help')}<div class="pad"><div class="card"><span class="badge">YOUR FINANCING SHOP</span><h2 style="font-size:20px">Pooja Electronics</h2><p class="small">Indore, Madhya Pradesh<br>Support hours: 10:00 AM–7:00 PM</p><button class="outline" onclick="sheet('Contact the shop','<p>The shop’s verified phone and support contact will appear here. No call or message is sent from this demo.</p>')">Contact shop →</button></div><div class="sectiontitle"><h2>Frequently asked questions</h2></div>${[['My payment is not updated','Keep your payment reference and receipt. Contact the shop to reconcile the payment before paying again.'],['I need help with my due date','Contact the shop to discuss available options. A date change is subject to the finance agreement and approval.'],['Why is my device restricted?','This demo has no device control. For a real financed device, contact the provider shown on your finance agreement.'],['How do I get my closure letter?','After all dues are verified and the plan closes, the applicable closure document should appear in My documents.']].map(x=>`<div class="card"><details><summary style="font-weight:bold;font-size:12px;cursor:pointer">${x[0]}</summary><p class="small">${x[1]}</p></details></div>`).join('')}${demotext()}</div>`}function render(){document.getElementById('app').innerHTML=header()+(view==='Home'?home():view==='My EMI'?emi():view==='Credit'?credit():view==='Support'?support():profile())+`<nav>${['Home','My EMI','Credit','Account'].map((x,i)=>`<button class="${view===x?'active':''}" onclick="go('${x}')"><i>${ic(icons[i])}</i>${x}</button>`).join('')}</nav>`}function sheet(t,b){document.getElementById('overlay').innerHTML=`<div class="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><button class="close" onclick="closeSheet()" aria-label="Close">×</button><h2>${t}</h2>${b}</div></div>`}function closeSheet(){document.getElementById('overlay').innerHTML=''}function toast(t){document.querySelector('.toast')?.remove();let a=document.createElement('div');a.className='toast';a.textContent=t;document.body.append(a);setTimeout(()=>a.remove(),3500)}function pay(){if(paid){receipt();return}sheet('Pay your installment',`<div class="small">SAMSUNG GALAXY A55 · EMI 04 / 10</div><div class="money">₹2,499</div><p>Due 24 October 2026 · No additional fee in this demo</p><div class="divider"></div><b style="font-size:12px">Choose payment method</b>${['UPI','Debit card','Net banking'].map(x=>`<button class="method ${method===x?'selected':''}" onclick="method='${x}';pay()">${x} ${method===x?'✓':''}</button>`).join('')}<button class="pay" onclick="complete()">Simulate successful payment →</button><p style="text-align:center;font-size:10px">No money will be charged. Do not enter payment credentials.</p>`)}function complete(){paid=true;render();sheet('Payment successful',`<div class="success"><i>✓</i><b style="font-size:30px">₹2,499</b><p>Your October installment is marked paid in this demo.</p><div class="card"><div class="small">Receipt VF-RCT-004<br>24 October 2026 · ${method}<br>Samsung Galaxy A55</div></div><button class="pay" onclick="closeSheet()">Back to home</button><button class="link" onclick="download('Receipt VF-RCT-004 — Demo payment INR 2499 received on 24 October 2026','Pooja_Demo_Receipt.txt')">Download demo receipt ↓</button></div>`)}function receipt(){sheet('Last payment receipt',`<div class="success"><i>✓</i><b style="font-size:30px">₹2,499</b><p>${paid?'24 October':'24 September'} 2026 · Successful demo payment</p><div class="small">Pooja Electronics · Rahul Sharma<br>Plan VF-2026-001</div><button class="pay" onclick="download('DEMO RECEIPT — INR 2499. Illustrative UI data only.','Pooja_Demo_Receipt.txt')">Download demo receipt</button></div>`)}function docs(){sheet('My documents',`<p>Your plan documents, together in one place.</p>${[['Installment statement','Sample repayment summary'],['Finance agreement','Illustrative agreement preview'],['Payment receipt','Latest demo installment receipt'],['Closure letter','Available after verified plan closure']].map((x,i)=>`<button class="method" onclick="${i===3?`toast('This sample plan is still active')`:`download('${x[0]} — DEMO ONLY. Rahul Sharma, VF-2026-001. This is illustrative UI content, not a legal or financial document.','Pooja_Demo_Document_${i+1}.txt')`}"><b>${x[0]}</b><div class="small">${x[1]} ${i<3?'↓':''}</div></button>`).join('')}`)}function history(){sheet('Payment history',`${[paid?'24 October 2026':null,'24 September 2026','24 August 2026','24 July 2026'].filter(Boolean).map(x=>`<div class="row"><span class="tick">✓</span><div style="flex:1"><b>₹2,499</b><div class="small">${x}</div></div><span class="badge">Successful</span></div>`).join('')}<p>Sample payment records only.</p>`)}function autoPay(){sheet('EMI AutoPay',`<span class="badge ${autopay?'':'due'}">${autopay?'Active in demo':'Not set up'}</span><p>Monthly installment collection, with your authorization.</p><div class="card"><div class="row"><span class="small">Installment</span><b>₹2,499</b></div><div class="row"><span class="small">Schedule</span><b>24th of each month</b></div><div class="row"><span class="small">Method</span><b>UPI AutoPay</b></div><div class="row"><span class="small">Final installment</span><b>₹2,509 · Apr 2027</b></div></div><p>In the live app, you will review the mandate amount/limit, validity and payee in your supported UPI app before authorizing it. No UPI app opens and no bank mandate is created in this preview.</p><button class="pay" onclick="autopay=!autopay;render();autoPay()">${autopay?'Reset demo AutoPay':'Preview activated AutoPay'}</button><p style="font-size:10px;text-align:center">UI simulation only · Subject to provider approval</p>`)}
function notifications(){sheet('Notifications',`<div class="card"><b>${paid?'Payment received':'Your EMI is due today'}</b><p>${paid?'Your October installment is paid in this demo.':'Your Samsung Galaxy A55 installment of ₹2,499 is due on 24 October.'}</p><span class="small">Today · Demo notification</span></div><div class="card"><b>Your plan documents are ready</b><p>Find your statement and agreement preview in My documents.</p></div>`)}function download(t,n){let u=URL.createObjectURL(new Blob([t],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();</script></body></html>
